  function ik(hx, hy, fx, fy){
    var dx = fx - hx, dy = fy - hy;
    var dist = Math.hypot(dx, dy) || 0.001;
    var d = Math.min(dist, L1 + L2 - 0.01);
    var a = (L1*L1 - L2*L2 + d*d) / (2*d);
    var h = Math.sqrt(Math.max(0, L1*L1 - a*a));
    var ux = dx / dist, uy = dy / dist;
    var mx = hx + a * ux, my = hy + a * uy;
    var nx = -uy, ny = ux;
    var k1x = mx + h * nx, k1y = my + h * ny;
    var k2x = mx - h * nx, k2y = my - h * ny;
    if (k1x >= k2x) return { x: k1x, y: k1y };
    return { x: k2x, y: k2y };
  }

  function updateLeg(hipX, hipY, angle, path, crank, pedal, foot){
    var px = bbX + crankR * Math.cos(angle);
    var py = bbY + crankR * Math.sin(angle);
    var k = ik(hipX, hipY, px, py);
    path.setAttribute('d', 'M' + hipX + ',' + hipY + ' L' + k.x.toFixed(2) + ',' + k.y.toFixed(2) + ' L' + px.toFixed(2) + ',' + (py - 3).toFixed(2));
    crank.setAttribute('x1', bbX);
    crank.setAttribute('y1', bbY);
    crank.setAttribute('x2', px.toFixed(2));
    crank.setAttribute('y2', py.toFixed(2));
    pedal.setAttribute('x', (px - 11).toFixed(2));
    pedal.setAttribute('y', (py - 3).toFixed(2));
    foot.setAttribute('cx', px.toFixed(2));
    foot.setAttribute('cy', (py - 7).toFixed(2));
  }

  function frame(now){
    var t = now / 1000;
    var i;
    for (i = 0; i < layers.length; i++){
      var off = -((layers[i].speed * t) % W);
      layers[i].el.setAttribute('transform', 'translate(' + off.toFixed(2) + ',0)');
    }
    var wheelDeg = (omegaWheel * t * 180 / Math.PI) % 360;
    spokesR.setAttribute('transform', 'rotate(' + wheelDeg.toFixed(2) + ',395,400)');
    spokesF.setAttribute('transform', 'rotate(' + wheelDeg.toFixed(2) + ',565,400)');
    sunRays.setAttribute('transform', 'rotate(' + (t * 8 % 360).toFixed(2) + ',0,0)');

    var crank = omegaCrank * t;
    var bob = 1.7 * Math.sin(2 * crank);
    pelican.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');

    updateLeg(hipFX, hipFY + bob, crank + Math.PI, legFarPath, crankFar, pedalFar, footFar);
    updateLeg(hipNX, hipFY + bob, crank, legNearPath, crankNear, pedalNear, footNear);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
